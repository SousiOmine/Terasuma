name: image

on:
  push:
    branches: [master]
  # PR でも型検査・lint・テスト・ビルドを通す（壊れたものを master へ入れない）。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 壊れたビルドを各マシンへ配らないよう、型検査とテストを通してから公開する。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Tailwind のプラグイン指定は bunfig.toml（開発）と scripts/build.ts（本番）の
      # 2 か所にある。片方だけ直すと CSS が未処理のまま出るので、ビルドまで通す。
      - run: bun run build

  publish:
    needs: check
    # PR では公開しない（検査だけ）。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR は小文字の名前しか受け付けないので、リポジトリ名から組み立てずに固定する。
      # 別のアカウントへ移すときは、ここと Quadlet の Image= を変える。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sousiomine/terasuma
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
